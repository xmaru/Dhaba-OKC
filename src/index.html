<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dhaba OKC</title>
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <!-- Single preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Combined font request -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <h2>
          <img
            src="images/TransparentLogoBig.png"
            alt="dhaba logo, a chicken rice bowl"
            class="logo"
          />
        </h2>
        <ul class="nav-links">
          <li><a href="#home">Home</a></li>
          <li><a href="pages/menuPage.html">Menu</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#contact">Contact</a></li>
          <li><a href="pages/cateringPage.html">Catering</a></li>
          <li>
            <button id="modeToggle" class="mode-toggle">
              <i class="fa-solid fa-sun"></i>
            </button>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="hero" id="hero">
        <div class="overlay"></div>

        <div class="hero-content">
          <h1>Dhaba OKC</h1>
          <h3>Authentic <span class="highlight">Pakistani</span> Cuisine</h3>
          <p class="hero-description">
            Experience the rich flavors of Pakistan right here in Oklahoma City.
          </p>
          <div class="hero-buttons">
            <button class="btn-primary">View Menu</button>
            <button class="glass-button">
              <i class="fa-solid fa-phone"></i>Call Now
            </button>
          </div>
          <p class="location">
            <i class="fa-solid fa-location-dot"></i> Oklahoma City, OK
          </p>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
