<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catering - Dhaba OKC</title>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/images/favicons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/images/favicons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/images/favicons/favicon-16x16.png"
    />
    <link rel="manifest" href="/assets/images/favicons/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/index.css" />
    <link rel="stylesheet" href="/css/menuPage.css" />
    <link rel="stylesheet" href="/css/cateringPage.css" />
  </head>
  <body class="page-with-fixed-nav catering-page">
    <div id="site-header" data-active-page="catering"></div>

    <main class="menu-page-main">
      <div class="menu-page-inner">
        <section
          class="menu-page-header"
          aria-labelledby="catering-page-title"
        >
          <div class="menu-page-title-wrap">
            <h1 id="catering-page-title" class="menu-page-title">
              Catering Services
            </h1>
          </div>
          <p class="menu-page-subtitle">
            Explore our catering menu for your special events. Contact us for
            custom orders and pricing.
          </p>
        </section>

        <section class="catering-panel" aria-label="Catering menu">
          <div class="catering-panel-inner">
            <div class="catering-toolbar">
              <label class="catering-search" for="catering-search">
                <span class="catering-search-label">Find a dish</span>
                <span class="catering-search-row">
                  <input
                    type="search"
                    id="catering-search"
                    class="catering-search-input"
                    placeholder="Search by name…"
                    autocomplete="off"
                    enterkeyhint="search"
                  />
                  <button
                    type="button"
                    class="catering-search-btn"
                    id="catering-search-btn"
                    aria-label="Search menu"
                  >
                    <i
                      class="fa-solid fa-magnifying-glass"
                      aria-hidden="true"
                    ></i>
                  </button>
                </span>
              </label>
            </div>

            <div
              class="catering-tabs"
              id="catering-tabs"
              role="tablist"
              aria-label="Menu category"
            ></div>

            <div
              class="catering-list"
              id="catering-menu"
              aria-live="polite"
            ></div>
          </div>
        </section>
      </div>
    </main>

    <footer>
      <div class="footer"></div>
    </footer>
    <script src="/utils/loadHeader.js"></script>
    <script src="/utils/loadFooter.js"></script>
    <script src="/js/cateringMenu.js"></script>
  </body>
</html>
